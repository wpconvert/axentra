<!DOCTYPE html>
<html lang="en">
<head>

  <script>

    const isLogin = localStorage.getItem("axentra_login");

    if(isLogin !== "true"){

      window.location.href = "https://wpconvert.github.io/axentra/";

    }

  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axentra • Transaction Logs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#050505;
      color:white;
      overflow:hidden;
    }

    .container{
      display:flex;
      width:100%;
      height:100vh;
    }

    .sidebar{
      width:280px;
      background:#0d0d0d;
      border-right:1px solid rgba(255,255,255,0.05);
      padding:30px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:40px;
    }

    .logo-box{
      width:55px;
      height:55px;
      border-radius:16px;
      background:#dc2626;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      font-weight:700;
      box-shadow:0 0 25px rgba(255,0,0,0.3);
    }

    .logo h1{
      font-size:30px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .menu a{
      text-decoration:none;
      color:#d1d5db;
      padding:16px 18px;
      border-radius:18px;
      transition:0.3s;
      display:flex;
      align-items:center;
      gap:15px;
      background:rgba(255,255,255,0.03);
    }

    .menu a:hover,
    .menu .active{
      background:linear-gradient(to right,#dc2626,#991b1b);
      color:white;
    }

    .role-box{
      margin-top:25px;
      padding:18px;
      border-radius:20px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
    }

    .role-box h3{
      color:#9ca3af;
      font-size:14px;
      margin-bottom:10px;
    }

    .role-badge{
      display:inline-block;
      padding:10px 18px;
      border-radius:50px;
      background:#dc2626;
      font-size:14px;
      font-weight:600;
    }

    .bottom-user{
      padding:20px;
      border-radius:22px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
    }

    .bottom-user p{
      color:#9ca3af;
      font-size:14px;
      margin-bottom:6px;
    }

    .bottom-user h2{
      font-size:22px;
    }

    .main{
      flex:1;
      padding:35px;
      overflow-y:auto;
      position:relative;
    }

    .back-btn{
      position:absolute;
      top:35px;
      right:35px;
      padding:14px 22px;
      border-radius:18px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      color:white;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .back-btn:hover{
      background:#dc2626;
    }

    .topbar{
      margin-bottom:35px;
    }

    .topbar h1{
      font-size:40px;
      margin-bottom:8px;
    }

    .topbar p{
      color:#9ca3af;
    }

    .logs-box{
      background:#111111;
      border-radius:35px;
      padding:35px;
      border:1px solid rgba(255,255,255,0.05);
    }

    .log-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 0;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .log-item:last-child{
      border-bottom:none;
    }

    .log-left{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .log-icon{
      width:60px;
      height:60px;
      border-radius:18px;
      background:rgba(255,0,0,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
    }

    .log-info h3{
      font-size:20px;
      margin-bottom:6px;
    }

    .log-info p{
      color:#9ca3af;
      font-size:14px;
      margin-bottom:4px;
    }

    .status{
      font-weight:700;
      font-size:16px;
    }

    .valid{
      color:#22c55e;
    }

    .invalid{
      color:#ef4444;
    }

    .empty{
      text-align:center;
      color:#6b7280;
      padding:50px 0;
      font-size:18px;
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="sidebar">

      <div>

        <div class="logo">
          <div class="logo-box">A</div>
          <h1>Axentra</h1>
        </div>

        <div class="menu">

          <a href="https://wpconvert.github.io/axentra/panel/dashboard/index.html">
            🏠 Dashboard
          </a>

          <a href="https://wpconvert.github.io/axentra/panel/bankinqu/index.html">
            🏦 Bank Inquiry
          </a>

          <a href="https://wpconvert.github.io/axentra/panel/walletinqu/index.html">
            💳 Ewallet Inquiry
          </a>

          <a href="#" class="active">
            📄 Transaction Logs
          </a>

        </div>

        <div class="role-box">
          <h3>ROLE ACCESS</h3>

          <div class="role-badge" id="roleText">
            ADMIN
          </div>
        </div>

      </div>

      <div class="bottom-user">
        <p>Logged in as</p>
        <h2 id="usernameText">admin</h2>
      </div>

    </div>

    <div class="main">

      <a href="https://wpconvert.github.io/axentra/panel/dashboard/index.html" class="back-btn">
        ← Back Dashboard
      </a>

      <div class="topbar">
        <h1>Transaction Logs</h1>
        <p>Last 20 inquiry activities from Axentra system.</p>
      </div>

      <div class="logs-box" id="logsContainer">

      </div>

    </div>

  </div>

  <script>

    const role = localStorage.getItem("axentra_role") || "admin";
    const username = localStorage.getItem("axentra_username") || "admin";

    document.getElementById("roleText").innerText = role.toUpperCase();
    document.getElementById("usernameText").innerText = username;

    const logs = JSON.parse(localStorage.getItem("axentra_logs")) || [];

    const logsContainer = document.getElementById("logsContainer");

    if(logs.length === 0){

      logsContainer.innerHTML = `
        <div class="empty">
          No transaction logs found
        </div>
      `;

    } else {

      logs.slice(0,20).forEach(log => {

        logsContainer.innerHTML += `

          <div class="log-item">

            <div class="log-left">

              <div class="log-icon">
                ${log.type === "Bank Inquiry" ? "🏦" : "💳"}
              </div>

              <div class="log-info">

                <h3>${log.type}</h3>

                <p>
                  ${log.bank || log.wallet}
                </p>

                <p>
                  ${log.norek || log.number}
                </p>

                <p>
                  ${log.name}
                </p>

                <p>
                  ${log.time}
                </p>

              </div>

            </div>

            <div class="status ${log.status === "VALID" ? "valid" : "invalid"}">
              ${log.status}
            </div>

          </div>

        `;

      });

    }

  </script>

</body>
</html>
