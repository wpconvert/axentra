<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axentra • Bank Inquiry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#050505;
      color:white;
      overflow:hidden;
    }

    .container{
      display:flex;
      width:100%;
      height:100vh;
    }

    .sidebar{
      width:280px;
      background:#0d0d0d;
      border-right:1px solid rgba(255,255,255,0.05);
      padding:30px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:40px;
    }

    .logo-box{
      width:55px;
      height:55px;
      border-radius:16px;
      background:#dc2626;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      font-weight:700;
      box-shadow:0 0 25px rgba(255,0,0,0.3);
    }

    .logo h1{
      font-size:30px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .menu a{
      text-decoration:none;
      color:#d1d5db;
      padding:16px 18px;
      border-radius:18px;
      transition:0.3s;
      display:flex;
      align-items:center;
      gap:15px;
      background:rgba(255,255,255,0.03);
    }

    .menu a:hover,
    .menu .active{
      background:linear-gradient(to right,#dc2626,#991b1b);
      color:white;
    }

    .role-box{
      margin-top:25px;
      padding:18px;
      border-radius:20px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
    }

    .role-box h3{
      color:#9ca3af;
      font-size:14px;
      margin-bottom:10px;
    }

    .role-badge{
      display:inline-block;
      padding:10px 18px;
      border-radius:50px;
      background:#dc2626;
      font-size:14px;
      font-weight:600;
    }

    .bottom-user{
      padding:20px;
      border-radius:22px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
    }

    .bottom-user p{
      color:#9ca3af;
      font-size:14px;
      margin-bottom:6px;
    }

    .bottom-user h2{
      font-size:22px;
    }

    .main{
      flex:1;
      padding:35px;
      overflow-y:auto;
      position:relative;
    }

    .back-btn{
      position:absolute;
      top:35px;
      right:35px;
      padding:14px 22px;
      border-radius:18px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      color:white;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .back-btn:hover{
      background:#dc2626;
    }

    .topbar{
      margin-bottom:35px;
    }

    .topbar h1{
      font-size:40px;
      margin-bottom:8px;
    }

    .topbar p{
      color:#9ca3af;
    }

    .inquiry-box{
      width:100%;
      max-width:800px;
      background:#111111;
      border-radius:35px;
      padding:35px;
      border:1px solid rgba(255,255,255,0.05);
      position:relative;
      overflow:hidden;
    }

    .inquiry-box::before{
      content:'';
      position:absolute;
      width:250px;
      height:250px;
      background:rgba(255,0,0,0.08);
      filter:blur(100px);
      top:-100px;
      right:-100px;
      border-radius:50%;
    }

    .input-group{
      margin-bottom:25px;
      position:relative;
      z-index:2;
    }

    .input-group label{
      display:block;
      margin-bottom:12px;
      color:#d1d5db;
      font-size:17px;
    }

    .input-group select,
    .input-group input{
      width:100%;
      background:#1a1a1a;
      border:1px solid rgba(255,255,255,0.08);
      padding:18px 22px;
      border-radius:18px;
      color:white;
      font-size:17px;
      outline:none;
    }

    .input-group select:focus,
    .input-group input:focus{
      border-color:#dc2626;
      box-shadow:0 0 0 3px rgba(220,38,38,0.2);
    }

    .check-btn{
      width:100%;
      padding:20px;
      border:none;
      border-radius:20px;
      background:linear-gradient(to right,#dc2626,#991b1b);
      color:white;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
      position:relative;
      z-index:2;
    }

    .check-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(255,0,0,0.2);
    }

    .loading{
      display:none;
      margin-top:25px;
      text-align:center;
      color:#ef4444;
      font-size:17px;
    }

    .result{
      display:none;
      margin-top:30px;
      padding:30px;
      border-radius:25px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
      position:relative;
      z-index:2;
    }

    .result h2{
      margin-bottom:20px;
      font-size:28px;
    }

    .result-item{
      margin-bottom:18px;
    }

    .result-item p{
      color:#9ca3af;
      margin-bottom:6px;
    }

    .result-item h3{
      font-size:22px;
    }

    .success{
      color:#22c55e;
    }

    .invalid{
      color:#ef4444;
    }

    @media(max-width:1100px){

      body{
        overflow:auto;
      }

      .container{
        flex-direction:column;
        height:auto;
      }

      .sidebar{
        width:100%;
      }

      .back-btn{
        position:relative;
        top:0;
        right:0;
        display:inline-block;
        margin-bottom:25px;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <div class="sidebar">

      <div>

        <div class="logo">
          <div class="logo-box">A</div>
          <h1>Axentra</h1>
        </div>

        <div class="menu">
          <a href="https://wpconvert.github.io/axentra/panel/dashboard/index.html">🏠 Dashboard</a>

          <a href="#" class="active">🏦 Bank Inquiry</a>

          <a href="https://wpconvert.github.io/axentra/panel/walletinqu/index.html">💳 Ewallet Inquiry</a>

          <a href="https://wpconvert.github.io/axentra/panel/logs/index.html">📄 Transaction Logs</a>
        </div>

        <div class="role-box">
          <h3>ROLE ACCESS</h3>

          <div class="role-badge" id="roleText">
            ADMIN
          </div>
        </div>

      </div>

      <div class="bottom-user">
        <p>Logged in as</p>
        <h2 id="usernameText">admin</h2>
      </div>

    </div>

    <div class="main">

      <a href="https://wpconvert.github.io/axentra/panel/dashboard/index.html" class="back-btn">
        ← Back Dashboard
      </a>

      <div class="topbar">
        <h1>Bank Inquiry</h1>
        <p>Check Indonesian bank account information securely.</p>
      </div>

      <div class="inquiry-box">

        <div class="input-group">
          <label>Select Bank</label>

          <select id="bank">
            <option value="mandiri">Bank Mandiri</option>
            <option value="bca">Bank BCA</option>
            <option value="bni">Bank BNI</option>
            <option value="bri">Bank BRI</option>
            <option value="permata">Bank Permata</option>
          </select>
        </div>

        <div class="input-group">
          <label>Account Number</label>

          <input type="text" id="norek" placeholder="Enter account number">
        </div>

        <button class="check-btn" id="checkBtn">
          Check Account
        </button>

        <div class="loading" id="loading">
          Checking bank account...
        </div>

        <div class="result" id="result">

          <h2>Inquiry Result</h2>

          <div class="result-item">
            <p>Bank</p>
            <h3 id="resultBank">-</h3>
          </div>

          <div class="result-item">
            <p>Account Number</p>
            <h3 id="resultNorek">-</h3>
          </div>

          <div class="result-item">
            <p>Account Name</p>
            <h3 id="resultName">-</h3>
          </div>

          <div class="result-item">
            <p>Status</p>
            <h3 id="resultStatus">-</h3>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    const role = localStorage.getItem("axentra_role") || "admin";
    const username = localStorage.getItem("axentra_username") || "admin";

    document.getElementById("roleText").innerText = role.toUpperCase();
    document.getElementById("usernameText").innerText = username;

    const checkBtn = document.getElementById("checkBtn");

    checkBtn.addEventListener("click", () => {

      const bank = document.getElementById("bank").value;
      const norek = document.getElementById("norek").value;

      const loading = document.getElementById("loading");
      const result = document.getElementById("result");

      if(norek === ""){

        alert("Please enter account number");
        return;

      }

      loading.style.display = "block";
      result.style.display = "none";

      setTimeout(() => {

        loading.style.display = "none";
        result.style.display = "block";

        let accountName = "";
        let status = "";
        let statusClass = "";

        if(norek.length >= 10){

          status = "VALID";
          statusClass = "success";

          if(bank === "mandiri") accountName = "BUDI SANTOSO";
          if(bank === "bca") accountName = "ANDI PRATAMA";
          if(bank === "bni") accountName = "RIZKY SAPUTRA";
          if(bank === "bri") accountName = "DEWI LESTARI";
          if(bank === "permata") accountName = "FAJAR NUGRAHA";

        } else {

          status = "INVALID ACCOUNT";
          statusClass = "invalid";
          accountName = "ACCOUNT NOT FOUND";

        }

        document.getElementById("resultBank").innerText = bank.toUpperCase();
        document.getElementById("resultNorek").innerText = norek;
        document.getElementById("resultName").innerText = accountName;

        const statusElement = document.getElementById("resultStatus");

        statusElement.innerText = status;
        statusElement.className = statusClass;

        const logs = JSON.parse(localStorage.getItem("axentra_logs")) || [];

        logs.unshift({
          type: "Bank Inquiry",
          bank: bank.toUpperCase(),
          norek: norek,
          name: accountName,
          status: status,
          time: new Date().toLocaleString()
        });

        localStorage.setItem("axentra_logs", JSON.stringify(logs));

      }, 1800);

    });

  </script>

</body>
</html>
